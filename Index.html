/* INTRO */

#il{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(3rem,12vw,6rem);letter-spacing:.3em;background:linear-gradient(135deg,#fff 0%,var(--rg) 50%,var(--r) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}

.pc::before{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(135deg,rgba(var(--rgb),.06) 0%,transparent 60%);pointer-events:none;z-index:1}
.bn{width:100%;height:120px;object-fit:cover;display:block}

.ct{flex:1}
.cs{font-size:.44rem;letter-spacing:3px;color:rgba(255,255,255,.2);text-transform:uppercase;display:block;margin-bottom:2px;transition:color .3s}
.cn{font-size:.65rem;font-weight:500;letter-spacing:3px;color:rgba(255,255,255,.6);transition:all .3s}

.meq span{display:block;width:2px;background:var(--r);border-radius:1px;opacity:0;transition:opacity .3s;animation:eq .7s ease-in-out infinite alternate}

.meq.on span{opacity:.8}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
#player{display:none}

/* EASING */
var E={
  oE:function(t){return t>=1?1:1-Math.pow(2,-10*t)},

    /* stars */
    pts.forEach(function(s){
      s.y+=s.sp;if(s.y>1){s.y=0;s.x=Math.random()}
      var tw=.5+.5*Math.sin(t*s.tw+s.tp),op=s.op*(.55+.45*tw)*rv,r=s.r*(1+.18*tw);
      ctx.beginPath();ctx.arc((s.x+(mX-.5)*.015)*W,(s.y+(mY-.5)*.01)*H,r,0,Math.PI*2);
      ctx.fillStyle=s.red?'rgba('+T.lrgb+','+op+')':'rgba(255,255,255,'+op+')';ctx.fill();
    });
    /* shooting */
    sh.forEach(function(s,i){
      if(s.delay>0){s.delay--;return}
      s.t+=s.spd;
      var px=(s.x+s.t)*W,py=(s.y+s.t*.15)*H;
      var op=s.t<.4?Math.min(1,s.t*5):Math.max(0,1-(s.t-.4)*3);
      if(s.t>1||op<=0){sh[i]=mk();return}
      var g=ctx.createLinearGradient(px-s.len,py-s.len*.15,px,py);
      g.addColorStop(0,'transparent');g.addColorStop(.5,'rgba('+T.rgb+','+(op*.25*rv)+')');
      g.addColorStop(1,'rgba('+T.lrgb+','+(op*.5*rv)+')');
      ctx.save();ctx.strokeStyle=g;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(px-s.len,py-s.len*.15);ctx.lineTo(px,py);ctx.stroke();ctx.restore();
    });
    requestAnimationFrame(fr);
  }fr();
})();

/* DISCORD PRESENCE — Lanyard (WebSocket temps réel + REST en secours) */
(function(){
  var ID='1220391265082933311',CDN='https://cdn.discordapp.com';
  var API='https://api.lanyard.rest/v1/users/'+ID,WS='wss://api.lanyard.rest/socket';
  var ST={online:['#23a55a','En ligne'],idle:['#f0b232','Absent'],dnd:['#f23f43','Ne pas déranger'],offline:['#80848e','Hors ligne']};
  var TYPE={0:'Joue à',1:'En live sur',2:'Écoute',3:'Regarde',5:'Participe à'};
  var $=function(i){return document.getElementById(i)};
  var DEF_AV=$('dAv').src,DEF_BN=$('dBanner').src;
  var last={av:null,pf:0},wsOk=false;

  function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
  function avUrl(u,size,anim){return CDN+'/avatars/'+u.id+'/'+u.avatar+((anim&&u.avatar.indexOf('a_')===0)?'.gif':'.png')+'?size='+size}

  /* précharge l'image puis la remplace (pas de flash, pas d'image cassée) */
  function swap(img,url,fb){
    if(img.dataset.u===url)return;img.dataset.u=url;
    var n=new Image();
    n.onload=function(){if(img.dataset.u===url)img.src=url};
    n.onerror=function(){if(img.dataset.u===url&&fb){img.dataset.u=fb;img.src=fb}};
    n.src=url;
  }

  /* ---------- PROFIL : bannière + couleurs ---------- */
  function toInt(c){if(typeof c==='string')c=parseInt(c.replace('#',''),16);return (typeof c==='number'&&isFinite(c))?c:null}
  function profile(id){
    return getJSON('https://dcdn.dstn.to/profile/'+id).then(function(p){
      var u=p.user||{},tc=(p.user_profile&&p.user_profile.theme_colors)||[];
      return {banner:u.banner||null,colors:tc.concat([u.accent_color,u.banner_color])};
    }).catch(function(){
      return getJSON('https://discordlookup.mesalytic.moe/v1/user/'+id).then(function(p){
        var b=p.banner||{};
        return {bannerUrl:b.link||null,colors:[p.accent_color,b.color]};
      });
    }).catch(function(){return null});
  }
  function fromName(u){
    var c=u.display_name_styles&&u.display_name_styles.colors;
    if(c&&c.length){var x=toInt(c[0]);if(x!==null){var p=rgb2h(x>>16&255,x>>8&255,x&255);if(p[1]>.15)shiftTheme(p[0],p[1]*100)}}
  }
  function dominant(im){
    var c=document.createElement('canvas');c.width=c.height=48;var x=c.getContext('2d'),d;
    try{x.drawImage(im,0,0,48,48);d=x.getImageData(0,0,48,48).data}catch(e){return null}
    var w=new Array(24).fill(0),hs=new Array(24).fill(0),ss=new Array(24).fill(0),tot=0;
    for(var i=0;i<d.length;i+=4){
      if(d[i+3]<200)continue;
      var p=rgb2h(d[i],d[i+1],d[i+2]),v=p[1]*(1-Math.abs(2*p[2]-1));
      if(v<.08)continue;
      var b=Math.floor(p[0]/15)%24;w[b]+=v;hs[b]+=v*p[0];ss[b]+=v*p[1];tot+=v;
    }
    var m=0;for(var k=1;k<24;k++)if(w[k]>w[m])m=k;
    if(tot<20||!w[m])return null;
    return [hs[m]/w[m],ss[m]/w[m]*100];
  }
  /* ordre : couleur du profil Discord > couleur dominante de la pdp > couleurs du pseudo */
  function pickTheme(cols,u){
    for(var i=0;i<cols.length;i++){
      var c=toInt(cols[i]);if(c===null)continue;
      var p=rgb2h(c>>16&255,c>>8&255,c&255);
      if(p[1]>.2&&p[2]>.08&&p[2]<.95)return shiftTheme(p[0],p[1]*100);
    }
    if(!u.avatar)return fromName(u);
    var im=new Image();im.crossOrigin='anonymous';
    im.onload=function(){var r=dominant(im);if(r)shiftTheme(r[0],r[1]);else fromName(u)};
    im.onerror=function(){fromName(u)};
    im.src=avUrl(u,64,false);
  }
  function refresh(u){
    last.pf=Date.now();last.av=u.avatar;
    profile(u.id).then(function(p){
      var bn=DEF_BN,cols=[];
      if(p){
        if(p.banner)bn=CDN+'/banners/'+u.id+'/'+p.banner+(p.banner.indexOf('a_')===0?'.gif':'.png')+'?size=600';
        else if(p.bannerUrl)bn=p.bannerUrl;
        cols=p.colors||[];
      }
      swap($('dBanner'),bn,DEF_BN);
      pickTheme(cols,u);
    });
  }

  /* ---------- ACTIVITÉS ---------- */
  function icon(sp){var i=document.createElement('i');i.className=sp?'fa-brands fa-spotify':'fa-solid fa-gamepad';return i}
  function actImg(a,d){
    var im=a.assets&&a.assets.large_image;
    if(a.id&&a.id.indexOf('spotify:')===0){
      if(d.spotify&&d.spotify.album_art_url)return d.spotify.album_art_url;
      return (im&&im.indexOf('spotify:')===0)?'https://i.scdn.co/image/'+im.slice(8):null;
    }
    if(!im)return null;
    if(im.indexOf('mp:')===0)return 'https://media.discordapp.net/'+im.slice(3);
    if(im.indexOf('spotify:')===0)return 'https://i.scdn.co/image/'+im.slice(8);
    return a.application_id?CDN+'/app-assets/'+a.application_id+'/'+im+'.png?size=128':null;
  }
  function line(cls,txt){var e=document.createElement('span');e.className=cls;e.textContent=txt;return e}
  function renderCustom(a){
    var el=$('cst');el.textContent='';
    if(!a||(!a.state&&!a.emoji))return;
    var e=a.emoji;
    if(e&&e.id){var im=new Image();im.alt='';im.src=CDN+'/emojis/'+e.id+(e.animated?'.gif':'.webp')+'?size=48';el.appendChild(im)}
    else if(e&&e.name)el.appendChild(document.createTextNode(e.name+' '));
    if(a.state)el.appendChild(line('',a.state));
  }
  function renderActs(list,d){
    var box=$('acts');box.textContent='';
    list.slice(0,2).forEach(function(a){
      var sp=!!(a.id&&a.id.indexOf('spotify:')===0),link=sp&&d.spotify&&d.spotify.track_id;
      var row=document.createElement(link?'a':'div');row.className='ar';
      if(link){row.href='https://open.spotify.com/track/'+encodeURIComponent(d.spotify.track_id);row.target='_blank';row.rel='noopener'}
      var ai=document.createElement('div');ai.className='ai';
      var src=actImg(a,d);
      if(src){var im=new Image();im.alt='';im.onerror=function(){ai.textContent='';ai.appendChild(icon(sp))};im.src=src;ai.appendChild(im)}
      else ai.appendChild(icon(sp));
      var at=document.createElement('div');at.className='at';
      at.appendChild(line('al',sp?'Écoute sur Spotify':(TYPE[a.type]||'Activité')));
      if(sp){
        at.appendChild(line('an',a.details||(d.spotify&&d.spotify.song)||'Spotify'));
        var art=(d.spotify&&d.spotify.artist)||a.state||'';
        if(art)at.appendChild(line('as',art.replace(/;\s*/g,', ')));
        if(a.timestamps&&a.timestamps.start&&a.timestamps.end){
          var pg=document.createElement('div'),bar=document.createElement('i');pg.className='pg';
          bar.dataset.s=a.timestamps.start;bar.dataset.e=a.timestamps.end;pg.appendChild(bar);at.appendChild(pg);
        }
      }else{
        at.appendChild(line('an',a.name||'Activité'));
        if(a.details)at.appendChild(line('as',a.details));
        if(a.state)at.appendChild(line('as',a.state));
        if(a.timestamps&&a.timestamps.start&&!a.timestamps.end){var t=line('as','');t.dataset.since=a.timestamps.start;at.appendChild(t)}
      }
      row.appendChild(ai);row.appendChild(at);box.appendChild(row);
    });
    tick();
  }
  function fmt(ms){var m=Math.floor(ms/60000);if(m<1)return 'Vient de commencer';var h=Math.floor(m/60);return 'Depuis '+(h?h+' h '+('0'+(m%60)).slice(-2):m+' min')}
  function tick(){
    var now=Date.now();
    document.querySelectorAll('#acts [data-since]').forEach(function(e){var t=now-(+e.dataset.since);if(t>=0)e.textContent=fmt(t)});
    document.querySelectorAll('#acts .pg i').forEach(function(e){var s=+e.dataset.s,en=+e.dataset.e;e.style.width=(Math.max(0,Math.min(1,(now-s)/(en-s)))*100)+'%'});
  }
  setInterval(tick,1000);

  /* ---------- MISE À JOUR ---------- */
  function update(d){
    if(!d||!d.discord_user)return;
    var u=d.discord_user;
    swap($('dAv'),u.avatar?avUrl(u,256,true):DEF_AV,DEF_AV);
    $('dName').textContent=u.display_name||u.global_name||u.username||'LEER';
    var s=ST[d.discord_status]||ST.offline;
    $('dDot').style.background=s[0];$('dDot').title=s[1];
    $('psd').style.background=s[0];$('pst').textContent=s[1];
    var pl=[];
    if(d.active_on_discord_desktop)pl.push('PC');
    if(d.active_on_discord_web)pl.push('Web');
    if(d.active_on_discord_mobile)pl.push('Mobile');
    $('psp').textContent=pl.join(' · ');
    var cs=null,list=[];
    (d.activities||[]).forEach(function(a){if(a.type===4)cs=a;else list.push(a)});
    renderCustom(cs);renderActs(list,d);
    $('pres').hidden=false;
    if(u.avatar!==last.av||Date.now()-last.pf>300000)refresh(u);
  }

  /* ---------- CONNEXION ---------- */
  function poll(){getJSON(API).then(function(r){if(r.success)update(r.data)}).catch(function(){})}
  poll();
  setInterval(function(){if(!wsOk)poll()},15000);

  var retry=0;
  function connect(){
    var ws,hb;
    try{ws=new WebSocket(WS)}catch(e){return}
    ws.onmessage=function(m){
      var p;try{p=JSON.parse(m.data)}catch(e){return}
      if(p.op===1){
        ws.send(JSON.stringify({op:2,d:{subscribe_to_id:ID}}));
        clearInterval(hb);
        hb=setInterval(function(){if(ws.readyState===1)ws.send(JSON.stringify({op:3}))},p.d.heartbeat_interval);
      }else if(p.op===0&&(p.t==='INIT_STATE'||p.t==='PRESENCE_UPDATE')){wsOk=true;retry=0;update(p.d)}
    };
    ws.onclose=function(){wsOk=false;clearInterval(hb);setTimeout(connect,Math.min(30000,2000*Math.pow(2,retry++)))};
    ws.onerror=function(){try{ws.close()}catch(e){}};
  }
  connect();
})();

/* YOUTUBE */
var yt=document.createElement('script');yt.src='https://www.youtube.com/iframe_api';document.head.appendChild(yt);
var player,started=false,mpReady=false;
function onYouTubeIframeAPIReady(){
  player=new YT.Player('player',{
    height:'1',width:'1',
    playerVars:{listType:'playlist',list:'PLPMWvmH_Lej8',autoplay:1,controls:0,rel:0,playsinline:1},
    events:{
      onReady:function(e){mpReady=true;e.target.setVolume(60);e.target.setShuffle(true);e.target.playVideo();showMP();updateMeta()},
      onStateChange:function(e){
        var p=e.data===1;
        document.getElementById('mpI').className=p?'fa-solid fa-pause':'fa-solid fa-play';
        document.getElementById('mpEq').classList.toggle('on',p);
        if(p){started=true;updateMeta()}
        if(e.data===0)player.nextVideo();
      }
    }
  });
}
function updateMeta(){
  if(!player||!player.getVideoData)return;
  setTimeout(function(){var d=player.getVideoData();if(d&&d.title)document.getElementById('mpT').textContent=d.title},800);
}
function showMP(){
  document.getElementById('mp').style.opacity='1';
  document.getElementById('scene').style.paddingBottom='90px';
}
function toggleMusic(){
  if(!mpReady)return;
  if(!started){player.playVideo();started=true;showMP();return}
  if(player.getPlayerState()===1)player.pauseVideo();else player.playVideo();
}
function prevTrack(){if(!mpReady)return;player.previousVideo();setTimeout(updateMeta,1000)}
function nextTrack(){if(!mpReady)return;player.nextVideo();setTimeout(updateMeta,1000)}
document.body.addEventListener('click',function(){if(!started&&mpReady){player.playVideo();started=true;showMP()}},{once:true});

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--r:#cc0000;--rl:#ff2222;--rg:#ff6666;--rgb:204,0,0;--rlrgb:255,100,100;--bg:#060000;--bgrgb:6,0,0}
html,body{width:100%;min-height:100vh;font-family:'Inter',sans-serif;color:#fff;cursor:none;background:var(--bg);overflow-x:hidden}

/* CURSOR */
#cur{position:fixed;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:transform .1s}
#cur2{position:fixed;width:36px;height:36px;border-radius:50%;border:1px solid rgba(var(--rgb),.4);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .18s ease}

/* AUDIO VISUALIZER */
#av{position:fixed;bottom:70px;left:0;right:0;height:35px;pointer-events:none;z-index:5;display:flex;align-items:flex-end;gap:1px;padding:0 20px;opacity:0;transition:opacity .3s}
#av.on{opacity:1}
.ab{flex:1;height:100%;background:linear-gradient(180deg,rgba(var(--rlrgb),.8),rgba(var(--rgb),.4));border-radius:2px;box-shadow:0 0 10px rgba(var(--rgb),.3);}

/* CANVAS */
#c{position:fixed;inset:0;z-index:0}
#c3p{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);width:100%;height:210px;z-index:100;pointer-events:none;opacity:0;transition:opacity .6s}
@media (max-width:640px){#c3p{height:175px}}
.p3d #mp{display:none!important}
.p3d #scene{padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))!important}
#c3d{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* INTRO */
#intro{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px}
#il{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(3rem,12vw,6rem);letter-spacing:.3em;background:linear-gradient(135deg,#fff 0%,var(--rg) 50%,var(--r) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
#ib-w{width:160px;height:1px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
#ib{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,transparent,var(--rl),#fff);box-shadow:0 0 20px var(--r)}

/* SCENE */
#scene{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px 110px;opacity:0}
.wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:10px}

/* PROFILE */
.pc{width:100%;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(30px);box-shadow:0 20px 60px rgba(0,0,0,.7);opacity:0;position:relative}
.pc::before{content:'';position:absolute;inset:0;border-radius:22px;background:linear-gradient(135deg,rgba(var(--rgb),.06) 0%,transparent 60%);pointer-events:none;z-index:1}
.bn{width:100%;height:120px;object-fit:cover;display:block}
.av-row{padding:0 16px;margin-top:-36px;position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between}
.av{width:72px;height:72px;border-radius:50%;border:3px solid var(--bg);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.8)}
.av img{width:100%;height:100%;object-fit:cover}
.dot{width:14px;height:14px;border-radius:50%;background:#23a55a;border:3px solid var(--bg);position:absolute;bottom:3px;right:3px}
.av-wrap{position:relative;display:inline-block}
.badges-inline{display:flex;gap:6px;padding-bottom:4px}
.bi{padding:4px 10px;border-radius:20px;background:rgba(var(--rgb),.12);border:1px solid rgba(var(--rgb),.2);font-size:.5rem;letter-spacing:1px;color:rgba(var(--rlrgb),.6);text-transform:uppercase}
.pb{padding:10px 16px 16px;position:relative;z-index:2}
.pname{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;letter-spacing:2px;margin-bottom:3px}
.ptag{font-size:.55rem;letter-spacing:2px;color:rgba(255,255,255,.25);margin-bottom:10px}
.bio{font-size:.75rem;color:rgba(255,255,255,.35);line-height:1.65;font-weight:300}

/* PRESENCE DISCORD */
.dot{transition:background .4s}
.pres{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px}
.pres[hidden]{display:none}
.ps{display:flex;align-items:center;gap:7px;font-size:.48rem;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.28)}
.ps i{width:6px;height:6px;border-radius:50%;background:#80848e;flex-shrink:0;transition:background .4s}
.ps b{font-weight:500;color:rgba(255,255,255,.55)}
.cst{display:flex;align-items:center;gap:7px;font-size:.7rem;color:rgba(255,255,255,.55);font-weight:300;line-height:1.5;word-break:break-word}
.cst img{width:18px;height:18px;object-fit:contain;flex-shrink:0}
.cst:empty,#acts:empty{display:none}
#acts{display:flex;flex-direction:column;gap:8px}
.ar{display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px;background:rgba(var(--rgb),.06);border:1px solid rgba(var(--rgb),.14);text-decoration:none;color:inherit;transition:background .3s,border-color .3s}
a.ar:hover{background:rgba(var(--rgb),.11);border-color:rgba(var(--rgb),.3)}
.ai{width:42px;height:42px;border-radius:9px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);font-size:.95rem}
.ai img{width:100%;height:100%;object-fit:cover;display:block}
.at{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.al{font-size:.44rem;letter-spacing:2.5px;color:rgba(var(--rlrgb),.55);text-transform:uppercase}
.an{font-size:.68rem;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as{font-size:.58rem;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300}
.pg{height:2px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--rl);border-radius:2px;transition:width 1s linear}

/* COMMUNAUTE */
.vc{font-size:.5rem;letter-spacing:3px;color:rgba(255,255,255,.28);text-transform:uppercase;text-align:center;padding-top:2px}
.vc[hidden]{display:none}
.vc i{margin-right:6px;color:rgba(var(--rlrgb),.5)}
@keyframes cmIn{from{opacity:0;transform:translateY(16px) scale(.97)}}

.div{width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.25),rgba(255,255,255,.08),transparent);margin:2px 0;opacity:0}

.card{width:100%;display:flex;align-items:center;text-decoration:none;color:#fff;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);transition:all .3s cubic-bezier(.34,1.56,.64,1);cursor:none;position:relative;overflow:hidden;opacity:0}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.04) 50%,transparent 65%);transform:translateX(-100%);transition:transform .5s}
.card:hover::after{transform:translateX(100%)}
.card:hover{background:rgba(var(--rgb),.08);border-color:rgba(var(--rgb),.25);transform:translateX(4px);box-shadow:-3px 0 20px rgba(var(--rgb),.08)}
.ci{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.95rem;color:rgba(255,255,255,.35);margin-right:13px;flex-shrink:0;transition:all .3s}
.gi{font-family:'Orbitron',sans-serif;font-weight:900;font-size:.82rem;transform:rotate(-10deg) skewX(-5deg);display:block}
.card:hover .ci{background:rgba(var(--rgb),.15);border-color:rgba(var(--rgb),.3);color:var(--rg)}
.ct{flex:1}
.cs{font-size:.44rem;letter-spacing:3px;color:rgba(255,255,255,.2);text-transform:uppercase;display:block;margin-bottom:2px;transition:color .3s}
.cn{font-size:.65rem;font-weight:500;letter-spacing:3px;color:rgba(255,255,255,.6);transition:all .3s}
.card:hover .cs{color:rgba(var(--rlrgb),.4)}
.card:hover .cn{color:#fff}
.ca{margin-left:auto;color:rgba(255,255,255,.15);font-size:.55rem;transition:all .3s;transform:translateX(-3px)}
.card:hover .ca{color:rgba(var(--rgb),.6);transform:translateX(3px)}

.ft{font-size:.42rem;letter-spacing:5px;color:rgba(255,255,255,.1);text-transform:uppercase;text-align:center;opacity:0;padding-top:4px}

/* BOUTONS 3D */
.card{overflow:visible;backdrop-filter:none;-webkit-backdrop-filter:none;transform-style:preserve-3d;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02)),rgba(var(--bgrgb),.55);border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(var(--rgb),.5),0 4px 0 rgba(var(--rgb),.34),0 6px 0 rgba(var(--rgb),.2),0 16px 26px rgba(0,0,0,.55)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(var(--rlrgb),.2),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover::before{opacity:1}
.card::after{border-radius:inherit;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;transform:none;transition:background-position .7s;pointer-events:none}
.card:hover::after{transform:none;background-position:-50% 0}
.card:hover{transform:none;background:linear-gradient(145deg,rgba(var(--rgb),.24),rgba(var(--rgb),.05)),rgba(var(--bgrgb),.6);border-color:rgba(var(--rgb),.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 3px 0 rgba(var(--rgb),.7),0 6px 0 rgba(var(--rgb),.45),0 9px 0 rgba(var(--rgb),.25),0 22px 34px rgba(0,0,0,.6),0 0 30px rgba(var(--rgb),.15)}
.card:active{translate:0 5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 rgba(var(--rgb),.6),0 8px 12px rgba(0,0,0,.5)}
.card .ci{transform:translateZ(26px);box-shadow:0 2px 0 rgba(var(--rgb),.3),0 8px 14px rgba(0,0,0,.5)}
.card .ct{transform:translateZ(16px)}
.card .ca{transform:translateZ(12px) translateX(-3px)}
.card:hover .ca{transform:translateZ(12px) translateX(3px)}
.mb{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);box-shadow:0 3px 0 rgba(255,255,255,.07),0 6px 12px rgba(0,0,0,.4)}
.mb:active{translate:0 3px;box-shadow:0 0 0 rgba(255,255,255,.07),0 1px 3px rgba(0,0,0,.4)}
.mb.main{border:none;box-shadow:0 4px 0 rgba(0,0,0,.45),0 4px 0 1px rgba(var(--rgb),.55),0 10px 20px rgba(var(--rgb),.4)}
.mb.main:hover{box-shadow:0 5px 0 rgba(0,0,0,.45),0 5px 0 1px var(--rl),0 12px 26px rgba(255,34,34,.5)}
.mb.main:active{translate:0 4px;box-shadow:0 0 0 rgba(0,0,0,.45),0 0 0 1px rgba(var(--rgb),.55),0 2px 8px rgba(var(--rgb),.4)}

#mp{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:14px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px)) 24px;background:rgba(var(--bgrgb),.9);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(40px);opacity:0;transition:opacity .4s}
#mp::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--rgb),.5),transparent)}
.ma{width:38px;height:38px;border-radius:8px;overflow:hidden;flex-shrink:0}
.ma img{width:100%;height:100%;object-fit:cover}
.mi{flex:1;min-width:0}
.mt{font-size:.58rem;letter-spacing:1px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ms{font-size:.42rem;letter-spacing:2px;color:rgba(255,255,255,.2);margin-top:2px}
.mc{display:flex;align-items:center;gap:8px;flex-shrink:0}
.mb{background:none;border:none;color:rgba(255,255,255,.3);cursor:none;font-size:.85rem;transition:all .2s;padding:7px;border-radius:50%;display:flex;align-items:center}
.mb:hover{color:#fff;background:rgba(255,255,255,.08)}
.mb.main{width:34px;height:34px;background:var(--r);color:#fff;font-size:.85rem;justify-content:center;border-radius:50%;box-shadow:0 0 20px rgba(var(--rgb),.4)}
.mb.main:hover{background:var(--rl);box-shadow:0 0 30px rgba(255,34,34,.5)}
.meq{display:flex;align-items:flex-end;gap:2px;height:14px;margin-left:6px}
.meq span{display:block;width:2px;background:var(--r);border-radius:1px;opacity:0;transition:opacity .3s;animation:eq .7s ease-in-out infinite alternate}
.meq span:nth-child(1){height:5px}.meq span:nth-child(2){height:11px;animation-delay:.1s}.meq span:nth-child(3){height:7px;animation-delay:.2s}.meq span:nth-child(4){height:13px;animation-delay:.08s}.meq span:nth-child(5){height:4px;animation-delay:.18s}
.meq.on span{opacity:.8}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}

/* VOLUME */
.vol{position:relative;display:flex;align-items:center}
#volBtn.open{color:#fff;background:rgba(var(--rgb),.25)}
.vpanel{position:absolute;right:0;bottom:calc(100% + 22px);display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:16px;background:rgba(var(--bgrgb),.97);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.7);backdrop-filter:blur(20px);z-index:120;animation:cmIn .2s ease}
.vpanel[hidden]{display:none}
.vpanel .mb{width:30px;height:30px;justify-content:center;font-size:.8rem}
#vol{-webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:2px;outline:none;cursor:none;background:linear-gradient(90deg,var(--rl) var(--v,60%),rgba(255,255,255,.12) var(--v,60%))}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(var(--rgb),.6);border:none}
#vol::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(var(--rgb),.6);border:none}
#vol::-moz-range-track{background:transparent}
#volPct{font-size:.58rem;letter-spacing:1px;color:rgba(255,255,255,.6);min-width:32px;text-align:right}
@media (max-width:520px){
  #mp{padding-left:14px;padding-right:14px;gap:10px}
  .meq{display:none}
  #vol{width:90px}
}

#player{position:fixed;width:200px;height:200px;left:0;bottom:0;opacity:.01;pointer-events:none;z-index:-1}

a,button{-webkit-tap-highlight-color:transparent}
@media (hover:none),(pointer:coarse){
  *{cursor:auto!important}
  #cur,#cur2{display:none!important}
}
</style>
</head>

<script>
/* AUDIO ANALYSIS POUR VISUALISEUR */
var audioCtx=null,analyser=null,dataArray=null,bassEnergy=0,midEnergy=0,trebleEnergy=0;
function initAudioAnalysis(){
  if(audioCtx||!player)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    dataArray=new Uint8Array(analyser.frequencyBinCount);
    var src=audioCtx.createMediaElementAudioSource(document.getElementById('player'));
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    document.getElementById('av').classList.add('on');
  }catch(e){}
}
function updateAudioLevels(){
  if(!analyser)return;
  try{
    analyser.getByteFrequencyData(dataArray);

  function renderActs(list,d){var box=$('acts');box.textContent='';list.slice(0,2).forEach(function(a){var sp=!!(a.id&&a.id.indexOf('spotify:')===0),link=sp&&d.spotify&&d.spotify.track_id;var row=document.createElement(link?'a':'div');row.className='ar';if(link){row.href='https://open.spotify.com/track/'+encodeURIComponent(d.spotify.track_id);row.target='_blank';row.rel='noopener'}var ai=document.createElement('div');ai.className='ai';var src=actImg(a,d);if(src){var im=new Image();im.alt='';im.onerror=function(){ai.textContent='';ai.appendChild(icon(sp))};im.src=src;ai.appendChild(im)}else ai.appendChild(icon(sp));var at=document.createElement('div');at.className='at';at.appendChild(line('al',sp?'Écoute sur Spotify':(TYPE[a.type]||'Activité')));if(sp){at.appendChild(line('an',a.details||(d.spotify&&d.spotify.song)||'Spotify'));var art=(d.spotify&&d.spotify.artist)||a.state||'';if(art)at.appendChild(line('as',art.replace(/;\s*/g,', ')));if(a.timestamps&&a.timestamps.start&&a.timestamps.end){var pg=document.createElement('div'),bar=document.createElement('i');pg.className='pg';bar.dataset.s=a.timestamps.start;bar.dataset.e=a.timestamps.end;pg.appendChild(bar);at.appendChild(pg)}}else{at.appendChild(line('an',a.name||'Activité'));if(a.details)at.appendChild(line('as',a.details));if(a.state)at.appendChild(line('as',a.state));if(a.timestamps&&a.timestamps.start&&!a.timestamps.end){var t=line('as','');t.dataset.since=a.timestamps.start;at.appendChild(t)}}row.appendChild(ai);row.appendChild(at);box.appendChild(row)});tick()}
  function fmt(ms){var m=Math.floor(ms/60000);if(m<1)return 'Vient de commencer';var h=Math.floor(m/60);return 'Depuis '+(h?h+' h '+('0'+(m%60)).slice(-2):m+' min')}
  function tick(){var now=Date.now();document.querySelectorAll('#acts [data-since]').forEach(function(e){var t=now-(+e.dataset.since);if(t>=0)e.textContent=fmt(t)});document.querySelectorAll('#acts .pg i').forEach(function(e){var s=+e.dataset.s,en=+e.dataset.e;e.style.width=(Math.max(0,Math.min(1,(now-s)/(en-s)))*100)+'%'})}
  setInterval(tick,1000);
  function update(d){if(!d||!d.discord_user)return;var u=d.discord_user;lastUser=u;swap($('dAv'),u.avatar?avUrl(u,256,true):DEF_AV,DEF_AV);$('dName').textContent=u.global_name||u.display_name||u.username||'LEER';$('dTag').textContent='@'+(u.username||'glitchsize');var s=ST[d.discord_status]||ST.offline;$('dDot').style.background=s[0];$('dDot').title=s[1];$('psd').style.background=s[0];$('pst').textContent=s[1];var pl=[];if(d.active_on_discord_desktop)pl.push('PC');if(d.active_on_discord_web)pl.push('Web');if(d.active_on_discord_mobile)pl.push('Mobile');$('psp').textContent=pl.join(' · ');var cs=null,list=[];(d.activities||[]).forEach(function(a){if(a.type===4)cs=a;else list.push(a)});renderCustom(cs);renderActs(list,d);$('pres').hidden=false;if(u.avatar!==last.av||Date.now()-last.pf>300000)refresh(u)}
  function poll(){getJSON(API).then(function(r){if(r.success)update(r.data)}).catch(function(){})}
  poll();setInterval(function(){if(!wsOk)poll()},15000);setInterval(function(){if(lastUser)refresh(lastUser)},60000);
  var retry=0;
  function connect(){var ws,hb;try{ws=new WebSocket(WS)}catch(e){return}ws.onmessage=function(m){var p;try{p=JSON.parse(m.data)}catch(e){return}if(p.op===1){ws.send(JSON.stringify({op:2,d:{subscribe_to_id:ID}}));clearInterval(hb);hb=setInterval(function(){if(ws.readyState===1)ws.send(JSON.stringify({op:3}))},p.d.heartbeat_interval)}else if(p.op===0&&(p.t==='INIT_STATE'||p.t==='PRESENCE_UPDATE')){wsOk=true;retry=0;update(p.d)}};ws.onclose=function(){wsOk=false;clearInterval(hb);setTimeout(connect,Math.min(30000,2000*Math.pow(2,retry++)))};ws.onerror=function(){try{ws.close()}catch(e){}}}
  connect();
})();
